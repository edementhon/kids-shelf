<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- kids-shelf app icon: four bright book spines on a wooden shelf, on a
       warm rounded square. Shapes are large and few so it still reads at
       16 px (desktop shortcut, taskbar, Dock). -->
  <rect x="16" y="16" width="480" height="480" rx="104" fill="#FFF3D6"/>
  <rect x="16" y="16" width="480" height="480" rx="104" fill="none" stroke="#F2C46D" stroke-width="12"/>
  <!-- books -->
  <rect x="96" y="132" width="72" height="236" rx="14" fill="#E8543F"/>
  <rect x="180" y="104" width="64" height="264" rx="14" fill="#2F9E6E"/>
  <rect x="256" y="148" width="72" height="220" rx="14" fill="#3B7DD8"/>
  <g transform="rotate(14 380 368)">
    <rect x="344" y="150" width="66" height="218" rx="14" fill="#F5B82E"/>
  </g>
  <!-- spine bands -->
  <rect x="96" y="176" width="72" height="16" fill="#FFF3D6" opacity="0.85"/>
  <rect x="180" y="150" width="64" height="16" fill="#FFF3D6" opacity="0.85"/>
  <rect x="256" y="192" width="72" height="16" fill="#FFF3D6" opacity="0.85"/>
  <!-- shelf -->
  <rect x="72" y="364" width="368" height="40" rx="12" fill="#A0652E"/>
  <rect x="72" y="396" width="368" height="10" rx="5" fill="#7A4A1E"/>
</svg>
